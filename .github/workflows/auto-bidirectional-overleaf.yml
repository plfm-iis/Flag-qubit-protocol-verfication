name: Automatic bidirectional paper sync

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!.github/**'
      - '!.ai/**'
      - '!AGENTS.md'
      - '!PAPER_CONTEXT.md'
      - '!CLAIMS.md'
      - '.github/overleaf-reconcile-request.json'
      - '.github/overleaf-github-authority-request.json'
      - '.github/overleaf-baseline-check-request.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overleaf-bridge
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Synchronize one-sided paper edits, refuse conflicts
        env:
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          SYNC_GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: python3 .github/scripts/overleaf_bridge.py auto
